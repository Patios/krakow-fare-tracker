name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Wizz Air timetable fares, every 4 hours.
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Wizz Air timetable
        run: npm run wizz
        timeout-minutes: 20
        continue-on-error: true
        env:
          WIZZ_PREVIOUS_URL: https://patios.github.io/krakow-fare-tracker/wizz.json
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /krakow-fare-tracker
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
